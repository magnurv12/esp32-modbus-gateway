<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modbus Live Test</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2230; --muted:#667085; --line:#dde1e8;
          --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --flash:#fde68a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --panel:#1b1f27; --text:#e6e9ef; --muted:#98a2b3; --line:#2c323d;
            --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --flash:#854d0e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; flex:1; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--err); display:inline-block; }
  .dot.on { background:var(--ok); }
  main { display:grid; gap:16px; padding:16px; grid-template-columns: minmax(0,340px) minmax(0,1fr); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  input, select { width:150px; padding:4px 6px; border:1px solid var(--line); border-radius:4px;
                  background:var(--bg); color:var(--text); font:inherit; }
  button { padding:6px 10px; border:0; border-radius:4px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .sub { border-top:1px solid var(--line); padding:10px 0; }
  .sub:first-child { border-top:0; padding-top:0; }
  .subhead { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .subhead b { font-size:14px; }
  .meta { color:var(--muted); font-size:12px; }
  .err { color:var(--err); font-size:12px; }
  .grid { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .cell { min-width:64px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; transition:background .6s; }
  .cell small { display:block; color:var(--muted); font-size:11px; }
  .cell span { font-variant-numeric: tabular-nums; font-weight:600; }
  .cell.flash { background:var(--flash); transition:none; }
  #log { height:180px; overflow:auto; font:12px ui-monospace, monospace; white-space:pre-wrap; color:var(--muted); margin:0; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>Modbus Live Test</h1>
  <span id="status" class="meta">connecting…</span>
</header>
<main>
  <div>
    <section>
      <h2>Subscribe</h2>
      <label>Id <input id="sid" value="holding-1"></label>
      <label>Slave <input id="sslave" type="number" min="1" max="247" value="1"></label>
      <label>Table <select id="stable"><option>holding</option><option>input</option><option>coils</option><option>discrete</option></select></label>
      <label>Start <input id="sstart" type="number" min="0" value="1"></label>
      <label>Count <input id="scount" type="number" min="1" value="7"></label>
      <label>Interval (ms) <input id="sinterval" type="number" min="100" value="500"></label>
      <button id="subscribe">Subscribe</button>
    </section>
    <section style="margin-top:16px">
      <h2>Write (REST, runs alongside the stream)</h2>
      <label>Table <select id="wtable"><option>holding</option><option>coils</option></select></label>
      <label>Address <input id="waddr" type="number" min="0" value="2"></label>
      <label>Value <input id="wvalue" value="77"></label>
      <button id="write">PUT</button> <span id="wresult" class="meta"></span>
    </section>
  </div>
  <div>
    <section>
      <h2>Live subscriptions</h2>
      <div id="subs"><p class="meta">No subscriptions yet.</p></div>
    </section>
    <section style="margin-top:16px">
      <h2>Messages</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const subs = new Map();   // id -> {request, el, cells, start}
let socket, retryMs = 500;

function log(line) {
  const el = $('log');
  el.textContent = `${new Date().toLocaleTimeString()}  ${line}\n` + el.textContent.slice(0, 8000);
}

function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => {
    retryMs = 500;
    $('dot').classList.add('on');
    $('status').textContent = 'connected';
    // The gateway forgets subscriptions on disconnect: send them again.
    for (const sub of subs.values()) socket.send(JSON.stringify(sub.request));
  };
  socket.onclose = () => {
    $('dot').classList.remove('on');
    $('status').textContent = `reconnecting in ${retryMs} ms…`;
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 5000);
  };
  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type !== 'update') log(event.data);
    handle(msg);
  };
}

function render(sub, values) {
  const isBit = sub.request.table === 'coils' || sub.request.table === 'discrete';
  sub.grid.innerHTML = '';
  sub.cells = values.map((value, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<small>${sub.start + i}</small><span></span>`;
    cell.lastChild.textContent = isBit ? (value ? 'ON' : 'off') : value;
    sub.grid.appendChild(cell);
    return cell;
  });
}

function handle(msg) {
  const sub = subs.get(msg.id);
  switch (msg.type) {
    case 'subscribed':
    case 'interval':
      if (sub) sub.meta.textContent =
        `slave ${msg.slave} · ${msg.table} ${msg.startAddress}–${msg.startAddress + msg.count - 1} · every ${msg.effectiveIntervalMs} ms`;
      break;
    case 'snapshot':
      if (!sub) return;
      sub.start = msg.startAddress;
      sub.error.textContent = '';
      render(sub, msg.values);
      break;
    case 'update':
      if (!sub || !sub.cells) return;
      const isBit = sub.request.table === 'coils' || sub.request.table === 'discrete';
      for (const [address, value] of msg.changes) {
        const cell = sub.cells[address - sub.start];
        if (!cell) continue;
        cell.lastChild.textContent = isBit ? (value ? 'ON' : 'off') : value;
        cell.classList.add('flash');
        requestAnimationFrame(() => requestAnimationFrame(() => cell.classList.remove('flash')));
      }
      break;
    case 'error':
      if (sub) sub.error.textContent = `${msg.error}${msg.retryInMs ? ` · retry in ${msg.retryInMs} ms` : ''}`;
      break;
    case 'unsubscribed':
      if (sub) { sub.el.remove(); subs.delete(msg.id); }
      if (!subs.size) $('subs').innerHTML = '<p class="meta">No subscriptions yet.</p>';
      break;
  }
}

$('subscribe').onclick = () => {
  const request = {
    op: 'subscribe', id: $('sid').value.trim(), slave: +$('sslave').value, table: $('stable').value,
    start: +$('sstart').value, count: +$('scount').value, intervalMs: +$('sinterval').value,
  };
  let sub = subs.get(request.id);
  if (!sub) {
    if (!subs.size) $('subs').innerHTML = '';
    const el = document.createElement('div');
    el.className = 'sub';
    el.innerHTML = '<div class="subhead"><b></b><span class="meta"></span>' +
                   '<button class="ghost">Unsubscribe</button></div><div class="err"></div><div class="grid"></div>';
    el.querySelector('b').textContent = request.id;
    sub = { el, meta: el.querySelector('.meta'), error: el.querySelector('.err'), grid: el.querySelector('.grid') };
    el.querySelector('button').onclick = () =>
      socket.send(JSON.stringify({ op: 'unsubscribe', id: request.id }));
    $('subs').appendChild(el);
    subs.set(request.id, sub);
  }
  sub.request = request;
  sub.start = request.start;
  if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(request));
};

$('write').onclick = async () => {
  const table = $('wtable').value;
  const body = table === 'coils'
    ? { state: ['1', 'true', 'on'].includes($('wvalue').value.toLowerCase()) }
    : { value: +$('wvalue').value };
  const started = performance.now();
  const res = await fetch(`/api/${table}/${$('waddr').value}?slave=${$('sslave').value}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const json = await res.json();
  $('wresult').textContent = `${res.status} ${json.status || json.error} · ${Math.round(performance.now() - started)} ms`;
};

connect();
</script>
</body>
</html>
