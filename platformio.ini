; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; Shared by every env below.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ESP32 (CP2102) -- pinned so auto-detect never picks the USB-RS485 dongle
; (CH340), which the Modbus simulator keeps open. Check with `ls /dev/cu.*`.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

[env:esp32dev]
build_flags =
	-D ASYNCWEBSERVER_REGEX
; Linked into flash: the OpenAPI spec (/api/openapi.yaml, Swagger UI at
; /docs) and the WebSocket test page (/ws-test).
board_build.embed_txtfiles =
	docs/openapi.yaml
	web/ws-test.html
; ModbusMaster is vendored in lib/ (configurable timeout, see lib/ModbusMaster/VENDORED.md).
lib_deps =
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
	bblanchon/ArduinoJson @ ^7
